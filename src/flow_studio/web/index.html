<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Flow Studio · 智能体平台</title>
<script>
try {
  document.documentElement.dataset.theme = localStorage.getItem("flow-studio-theme") === "light"
    ? "light" : "dark";
} catch (_) { document.documentElement.dataset.theme = "dark"; }
</script>
<link rel="stylesheet" href="style.css?v=22">
</head>
<body>

<main id="auth-shell" class="auth-shell">
  <section class="auth-panel">
    <div class="auth-brand"><span class="mark">◆</span><span>Flow Studio</span></div>
    <h1 id="auth-title">正在检查实例</h1>
    <p id="auth-subtitle">请稍候</p>
    <form id="auth-form"></form>
  </section>
</main>

<!-- 全局导航：智能体是核心，工作流（画布）是编排工具 -->
<header id="global-nav" class="app-authenticated">
  <div class="brand"><span class="mark">◆</span><span class="brand-name">Flow Studio</span></div>
  <nav class="nav-tabs">
    <button id="nav-agents" class="on">智能体</button>
    <button id="nav-flows">工作流画布</button>
  </nav>
  <div class="spacer"></div>
  <div class="nav-actions">
    <button id="btn-theme" class="icon-btn" title="切换浅色主题" aria-label="切换浅色主题">☀</button>
    <button id="btn-res" title="知识库 / 技能 / MCP / 记忆 / 评测">资源库</button>
    <button id="btn-gov" title="版本 / 审批 / 成员 / 策略 / 审计">治理</button>
    <select id="workspace-select" title="当前 Workspace"></select>
    <span id="user-role" class="role-badge"></span>
    <span id="user-name"></span>
    <button id="btn-logout" class="icon-btn" title="退出登录" aria-label="退出登录">↪</button>
  </div>
</header>

<!-- 工作流画布视图的工具栏（仅在画布视图显示） -->
<header id="topbar" class="view-hidden app-authenticated">
  <button id="btn-flow-back" title="返回工作流列表">← 工作流</button>
  <button id="btn-palette" class="mobile-only" title="节点面板">＋节点</button>
  <select id="flow-select" title="选择流程"></select>
  <button id="btn-new" title="新建空白流程">新建</button>
  <button id="btn-del" class="danger" title="删除当前流程">删除</button>
  <span class="sep"></span>
  <button id="btn-save" class="primary" title="保存流程（⌘S）">保存</button>
  <span id="flow-governance"></span>
  <button id="btn-run" class="primary" title="运行当前流程">▶ 运行</button>
  <button id="btn-runs" title="查看流程运行记录">运行记录</button>
  <span id="run-status"></span>
  <button id="btn-models" title="配置分镜 LLM / 文生图 / 图生视频模型">模型</button>
  <button id="btn-media" title="素材库：上传 / 预览 / 删除素材">素材库</button>
  <button id="btn-insp" class="mobile-only" title="属性面板">属性</button>
  <div class="spacer"></div>
  <div id="chat-box" title="意图触发：自动路由到最匹配的流程并执行">
    <input id="chat-input" placeholder="说一句话，触发一个流程，如：跑一下应聘demo">
    <button id="chat-send" class="primary">触发</button>
  </div>
</header>

<!-- 智能体主页（默认视图） -->
<section id="agents-view" class="app-authenticated">
  <div id="agents-hero">
    <div>
      <h1>智能体</h1>
      <p>知识库、记忆、技能、工具、MCP 都配对在智能体身上；对话式或流程编排任选。画布里的「智能体」节点可以把它们组装进更大的流程。</p>
    </div>
    <button id="agents-new" class="primary">＋ 创建智能体</button>
  </div>
  <div id="agents-grid"></div>
</section>

<!-- 工作流列表（进入画布前先选择要编辑的流程） -->
<section id="flows-view" class="view-hidden app-authenticated">
  <div id="flows-hero">
    <div>
      <h1>工作流</h1>
      <p>查看已有编排，选择一个流程进入画布编辑。</p>
    </div>
    <button id="flows-new" class="primary">＋ 新增工作流</button>
  </div>
  <div id="flows-grid"></div>
</section>

<!-- 工作流画布视图 -->
<div id="main" class="view-hidden app-authenticated">
  <aside id="palette">
    <button id="palette-close" class="drawer-close mobile-only" title="收起">×</button>
    <h3>节点</h3>
    <div id="palette-list"></div>
    <div class="palette-note">知识库 / 记忆 / 技能 / 工具 / MCP 都是<b>智能体的能力</b>，在智能体中配置；画布只用「智能体」节点调用它。<br>点击节点类型添加到画布；拖端口连线；条件/意图连线双击改分支。</div>
  </aside>

  <div id="canvas-wrap">
    <div id="world">
      <svg id="edges" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div id="canvas-hint">拖拽空白处平移 · 滚轮缩放 · Delete 删除选中 · ⌘S 保存</div>
    <div id="zoom-controls">
      <button id="btn-zoom-out" class="canvas-fab zoom-fab" title="缩小">−</button>
      <span id="zoom-label" title="当前缩放">100%</span>
      <button id="btn-zoom-in" class="canvas-fab zoom-fab" title="放大">＋</button>
      <button id="btn-fit" class="canvas-fab" title="适配屏幕">⤢ 适配</button>
    </div>
    <canvas id="minimap" width="176" height="110" title="小地图：点击/拖动跳转视角"></canvas>

    <div id="run-panel">
      <div class="rp-head">
        <span id="rp-title">运行结果</span>
        <span id="rp-status"></span>
        <button id="rp-snapshot">执行图快照</button>
        <button id="rp-close">收起</button>
      </div>
      <div class="rp-tools">
        <div class="rp-tabs" role="tablist" aria-label="运行详情">
          <button data-run-tab="nodes" role="tab" aria-selected="true">节点</button>
          <button data-run-tab="logs" role="tab" aria-selected="false">日志 <span id="rp-log-count">0</span></button>
          <button data-run-tab="output" role="tab" aria-selected="false">输出</button>
        </div>
        <span id="rp-connection" role="status"></span>
        <label class="rp-follow"><input type="checkbox" id="rp-follow" checked>自动滚动</label>
      </div>
      <div id="rp-version-note"></div>
      <div id="rp-list" class="rp-content" role="tabpanel"></div>
      <div id="rp-logs" class="rp-content" role="log" aria-label="节点运行日志" hidden></div>
      <div id="rp-output" class="rp-content" role="tabpanel" hidden></div>
    </div>
  </div>

  <aside id="inspector">
    <button id="insp-close" class="drawer-close mobile-only" title="收起">×</button>
    <div id="insp-body"></div>
  </aside>
</div>

<!-- 智能体对话面板 -->
<aside id="chat-panel">
  <button id="chatp-close" class="drawer-close" title="关闭">×</button>
  <div id="chatp-head">
    <span id="chatp-ico">✨</span>
    <div class="chatp-title"><b id="chatp-name">—</b><span id="chatp-mode" class="chip"></span></div>
    <button id="chatp-new" title="清空并开始新会话">新会话</button>
  </div>
  <div id="chatp-msgs"></div>
  <div id="chatp-input-row">
    <textarea id="chatp-input" rows="1" placeholder="输入消息，Enter 发送"></textarea>
    <button id="chatp-send" class="primary">发送</button>
  </div>
</aside>

<aside id="media-panel">
  <button id="media-close" class="drawer-close" title="收起">×</button>
  <h3>素材库</h3>
  <div id="media-toolbar">
    <div id="media-filters"></div>
    <button id="media-upload-btn" class="primary">⬆ 上传素材</button>
    <input id="media-upload-input" type="file" multiple accept="image/*,video/*,audio/*" hidden>
  </div>
  <div id="media-grid"></div>
</aside>

<aside id="res-panel">
  <button id="res-close" class="drawer-close" title="收起">×</button>
  <h3>资源库</h3>
  <div id="res-tabs"></div>
  <div id="res-body"></div>
</aside>

<aside id="gov-panel">
  <button id="gov-close" class="drawer-close" title="收起">×</button>
  <h3>治理中心</h3>
  <div id="gov-tabs"></div>
  <div id="gov-body"></div>
</aside>

<div id="modal-mask"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script src="app.js?v=25"></script>
</body>
</html>
