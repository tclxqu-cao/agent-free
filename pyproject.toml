[project]
name = "job-agent"
version = "0.1.0"
description = "智能应聘 Agent：多招聘网站抓取、趋势分析、学习与进阶建议 + Flow Studio 编排画布"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
studio = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
job-agent = "job_agent.cli:main"
flow-studio = "flow_studio.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent", "src/flow_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
